<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משלוח מנות קהילתי</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>משלוח מנות קהילתי - יפה נוף (התשפ"ו)</h1>
            <p class="subtitle">בחרו מסלול, שלמו ומלאו את הטופס</p>
        </header>

        <form id="orderForm">
            <!-- Package Selection Section -->
            <div class="form-section">
                <h2>בחרו מסלול</h2>
                <div class="form-group">
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="packageType" value="basic" data-popup="1" required>
                            <span class="radio-label">
                                <strong>מסלול ארד</strong>
                                <span class="price">120 ש"ח</span>
                            </span>
                        </label>

                        <label class="radio-option">
                            <input type="radio" name="packageType" value="premium" data-popup="2" required>
                            <span class="radio-label">
                                <strong>מסלול כסף</strong>
                                <span class="price">180 ש"ח</span>
                            </span>
                        </label>

                        <label class="radio-option">
                            <input type="radio" name="packageType" value="deluxe" data-popup="3" required>
                            <span class="radio-label">
                                <strong>מסלול זהב</strong>
                                <span class="price">300 ש"ח</span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Personal Information Section -->
            <div class="form-section">
                <h2>פרטי משלוח</h2>

                <div class="form-group">
                    <label for="fullName">שמות פרטיים ומשפחה <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="מר וגברת כהן" required>
                </div>

                <div class="form-group">
                    <label for="phone">מספר טלפון <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="05X-XXXXXXX" required>
                </div>

                <div class="form-group">
                    <label for="address">כתובת <span class="required">*</span></label>
                    <input type="text" id="address" name="address" required>
                </div>

                <div class="form-group">
                    <label for="floor">קומה <span class="required">*</span></label>
                    <input type="text" id="floor" name="floor" required>
                </div>

                <div class="form-group">
                    <label for="apartment">דירה <span class="required">*</span></label>
                    <input type="text" id="apartment" name="apartment" required>
                </div>

                <div class="form-group">
                    <label for="buildingCode">קוד לבניין <span class="optional">(לא חובה אבל עדיף)</span></label>
                    <input type="text" id="buildingCode" name="buildingCode">
                </div>
            </div>

            <!-- Submit Button -->
            <div class="form-actions">
                <button type="submit" class="submit-btn">המשך לתשלום</button>
            </div>
        </form>

        <!-- Payment Modal -->
        <div id="paymentModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>השלמת תשלום</h2>
                <p>לאחר השלמת התשלום או סגירת החלון, פרטי ההזמנה שלכם יישלחו לגוגל.</p>
                <div id="paymentFrame">
                    <iframe id="paymentIframe" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
